name: Build, Test & Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with binaries attached'
        type: boolean
        default: true
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        type: string
        default: 'v0.1.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-backend:
    name: Test Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --workspace --verbose

  test-frontend:
    name: Test Frontend (React & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -s package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint frontend code
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          fi

      - name: Typecheck TypeScript
        run: |
          if npm run | grep -q "typecheck"; then
            npm run typecheck
          fi

      - name: Test frontend build
        run: |
          if npm run | grep -q "build"; then
            npm run build
          fi

  build-desktop:
    name: Build (${{ matrix.platform.name }})
    needs: [test-backend, test-frontend]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux (Ubuntu x86_64)
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            artifact_name: locardx-linux-x86_64
            bundle_path: src-tauri/target/release/bundle
          - name: Windows (x86_64)
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_name: locardx-windows-x86_64
            bundle_path: src-tauri/target/release/bundle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install

      - name: Build frontend distribution
        run: npm run build --prefix frontend

      - name: Build Tauri Desktop application bundle
        run: npx tauri build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: |
            ${{ matrix.platform.bundle_path }}/deb/*.deb
            ${{ matrix.platform.bundle_path }}/appimage/*.AppImage
            ${{ matrix.platform.bundle_path }}/msi/*.msi
            ${{ matrix.platform.bundle_path }}/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30

  deploy-release:
    name: Deploy GitHub Release
    needs: [build-desktop]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List collected release files
        run: |
          find release-artifacts -type f

      - name: Determine tag name
        id: vars
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag_name || 'v0.1.0' }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: LocardX ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
